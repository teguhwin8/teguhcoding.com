<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" fill="none">
  <rect width="1200" height="700" rx="28" fill="#F3F4FA"/>
  <text x="66" y="74" fill="#27294B" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">RINGKASAN KOMITMEN SAHAM</text>
  <text x="66" y="116" fill="#27294B" font-family="Arial, sans-serif" font-size="30" font-weight="700">Apa yang diumumkan Anthropic?</text>
  <rect x="65" y="154" width="335" height="318" rx="20" fill="#FFFFFF" stroke="#DDDDF0" stroke-width="2"/>
  <rect x="90" y="180" width="64" height="9" rx="4.5" fill="#7566D7"/>
  <text x="90" y="258" fill="#5143B2" font-family="Arial, sans-serif" font-size="55" font-weight="700">5%</text>
  <text x="90" y="300" fill="#27294B" font-family="Arial, sans-serif" font-size="21" font-weight="700">komitmen awal</text>
  <text x="90" y="343" fill="#646681" font-family="Arial, sans-serif" font-size="17">Saham untuk dana baru.</text>
  <text x="90" y="372" fill="#646681" font-family="Arial, sans-serif" font-size="17">Masih menunggu persetujuan</text>
  <text x="90" y="401" fill="#646681" font-family="Arial, sans-serif" font-size="17">pemegang saham.</text>
  <rect x="90" y="431" width="250" height="1" fill="#E6E6F0"/>
  <text x="90" y="457" fill="#777991" font-family="Arial, sans-serif" font-size="14">ANTHROPIC PUBLIC BENEFIT FUND</text>

  <rect x="432" y="154" width="335" height="318" rx="20" fill="#FFFFFF" stroke="#DDDDF0" stroke-width="2"/>
  <rect x="457" y="180" width="64" height="9" rx="4.5" fill="#2AA997"/>
  <text x="457" y="258" fill="#168878" font-family="Arial, sans-serif" font-size="55" font-weight="700">+2%</text>
  <text x="457" y="300" fill="#27294B" font-family="Arial, sans-serif" font-size="21" font-weight="700">tiap kenaikan nilai 50%</text>
  <text x="457" y="343" fill="#646681" font-family="Arial, sans-serif" font-size="17">Bisa ditambahkan saat nilai</text>
  <text x="457" y="372" fill="#646681" font-family="Arial, sans-serif" font-size="17">perusahaan tumbuh. Keputusan</text>
  <text x="457" y="401" fill="#646681" font-family="Arial, sans-serif" font-size="17">tetap di tangan dewan.</text>
  <rect x="457" y="431" width="250" height="1" fill="#E6E6F0"/>
  <text x="457" y="457" fill="#777991" font-family="Arial, sans-serif" font-size="14">PATOKAN NILAI BELUM DIUMUMKAN</text>

  <rect x="799" y="154" width="335" height="318" rx="20" fill="#FFFFFF" stroke="#DDDDF0" stroke-width="2"/>
  <rect x="824" y="180" width="64" height="9" rx="4.5" fill="#E4A847"/>
  <text x="824" y="258" fill="#AD731D" font-family="Arial, sans-serif" font-size="55" font-weight="700">≈20%</text>
  <text x="824" y="300" fill="#27294B" font-family="Arial, sans-serif" font-size="21" font-weight="700">komitmen gabungan</text>
  <text x="824" y="343" fill="#646681" font-family="Arial, sans-serif" font-size="17">Termasuk janji saham pendiri</text>
  <text x="824" y="372" fill="#646681" font-family="Arial, sans-serif" font-size="17">dan program donasi karyawan,</text>
  <text x="824" y="401" fill="#646681" font-family="Arial, sans-serif" font-size="17">bukan hanya dana yang baru.</text>
  <rect x="824" y="431" width="250" height="1" fill="#E6E6F0"/>
  <text x="824" y="457" fill="#777991" font-family="Arial, sans-serif" font-size="14">MENURUT PERHITUNGAN ANTHROPIC</text>

  <rect x="65" y="508" width="1069" height="122" rx="18" fill="#202145"/>
  <circle cx="106" cy="569" r="18" fill="#63D4C2"/>
  <path d="M98 569h16M106 561v16" stroke="#173B42" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="558" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">Bentuk dana: LLC yang sepenuhnya dimiliki Anthropic</text>
  <text x="145" y="591" fill="#C6C7DE" font-family="Arial, sans-serif" font-size="16">Penerima, tata kelola, dan aturan penyaluran akan dijelaskan kemudian.</text>
  <text x="66" y="667" fill="#777991" font-family="Arial, sans-serif" font-size="14">Angka berasal dari pengumuman perusahaan; tambahan saham bersifat diskresioner.</text>
</svg>
