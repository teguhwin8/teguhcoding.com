<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <title>Hostinger AI Automation App - Asisten AI Telegram dan WhatsApp 24 Jam</title>
  <defs>
    <linearGradient id="bgGrad" x1="100" y1="50" x2="1100" y2="625" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="200" y1="200" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="280" cy="200" r="260" fill="#4F46E5" fill-opacity="0.18" filter="blur(80px)"/>
  <circle cx="950" cy="450" r="280" fill="#10B981" fill-opacity="0.12" filter="blur(90px)"/>

  <!-- Main Card -->
  <rect x="180" y="110" width="840" height="455" rx="20" fill="#1F2937" fill-opacity="0.75" stroke="#374151" stroke-width="1.5"/>

  <!-- Header Bar inside Card -->
  <rect x="180" y="110" width="840" height="64" rx="20" fill="#111827" fill-opacity="0.9"/>
  <circle cx="225" cy="142" r="6" fill="#EF4444"/>
  <circle cx="245" cy="142" r="6" fill="#F59E0B"/>
  <circle cx="265" cy="142" r="6" fill="#10B981"/>
  <text x="300" y="147" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="14" font-weight="500">docker run hostinger/ai-automation-app --daemon</text>

  <!-- Badge 60 Detik -->
  <rect x="850" y="128" width="145" height="28" rx="14" fill="#065F46" fill-opacity="0.6"/>
  <text x="868" y="146" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Active 24/7 • Docker</text>

  <!-- Central Visual Elements -->
  <!-- Left Box: Integrations -->
  <rect x="230" y="210" width="340" height="240" rx="14" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="260" y="250" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Asisten AI Siap Pakai</text>
  
  <!-- Telegram row -->
  <rect x="260" y="275" width="280" height="42" rx="8" fill="#1F2937"/>
  <circle cx="282" cy="296" r="10" fill="#0284C7"/>
  <text x="305" y="301" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Telegram Bot Integration</text>

  <!-- WhatsApp row -->
  <rect x="260" y="328" width="280" height="42" rx="8" fill="#1F2937"/>
  <circle cx="282" cy="349" r="10" fill="#16A34A"/>
  <text x="305" y="354" fill="#DCFCE7" font-family="system-ui, sans-serif" font-size="13" font-weight="500">WhatsApp Automation Hub</text>

  <!-- Built-in AI row -->
  <rect x="260" y="380" width="280" height="42" rx="8" fill="#1F2937"/>
  <circle cx="282" cy="401" r="10" fill="#8B5CF6"/>
  <text x="305" y="406" fill="#EDE9FE" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Built-in AI Credits &amp; Search</text>

  <!-- Right Box: Features & Pricing -->
  <rect x="610" y="210" width="360" height="240" rx="14" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="640" y="250" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Tanpa Setup Server</text>

  <text x="640" y="285" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">✓ Deployment instan dalam 60 detik</text>
  <text x="640" y="312" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">✓ Full CLI access &amp; maintenance otomatis</text>
  <text x="640" y="339" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">✓ Keamanan &amp; update berkala terjaga</text>

  <!-- Price Tag Highlight -->
  <rect x="640" y="365" width="300" height="60" rx="10" fill="url(#purpleGrad)"/>
  <text x="660" y="390" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Mulai dari (Diskon 20%)</text>
  <text x="660" y="413" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Rp78.900 / bulan</text>

  <!-- Footer Tagline -->
  <text x="600" y="525" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
    Hostinger AI Automation App: Solusi Bot Asisten 24 Jam Tanpa Kelola VPS
  </text>
</svg>
