<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SPACE, sandbox microVM untuk AI agent</title>
  <desc id="desc">Ilustrasi konseptual Perplexity SPACE yang menempatkan kode agent di microVM terpisah dengan kontrol jaringan di luar VM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a2b"/><stop offset="1" stop-color="#183340"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#f5be58"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".1" stroke="#bed1d7"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200"/><path d="M100 0V675M200 0V675M300 0V675M400 0V675M500 0V675M600 0V675M700 0V675M800 0V675M900 0V675M1000 0V675M1100 0V675"/></g>
  <circle cx="925" cy="336" r="210" fill="#42cbb6" opacity=".08" filter="url(#glow)"/>
  <text x="76" y="145" fill="#66d9ca" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">PERPLEXITY · OPEN SOURCE</text>
  <text x="72" y="268" fill="#f3f6f7" font-family="Arial, sans-serif" font-size="88" font-weight="700">SPACE</text>
  <text x="77" y="324" fill="#d4e0e3" font-family="Arial, sans-serif" font-size="25">Sandbox microVM untuk AI agent</text>
  <text x="78" y="367" fill="#9cb1ba" font-family="Arial, sans-serif" font-size="18">Isolasi eksekusi · kontrol egress · kredensial di luar guest</text>
  <rect x="78" y="421" width="186" height="45" rx="22" fill="#183d45" stroke="#347d78"/>
  <text x="171" y="450" text-anchor="middle" fill="#b8f1e4" font-family="Arial, sans-serif" font-size="17" font-weight="700">APACHE 2.0</text>
  <g transform="translate(668 112)">
    <rect x="0" y="0" width="440" height="438" rx="30" fill="#1a2b35" stroke="#57717c" stroke-width="2"/>
    <text x="32" y="47" fill="#a8c0c7" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">EXECUTION BOUNDARY</text>
    <rect x="34" y="78" width="372" height="245" rx="24" fill="#122129" stroke="#40bcae" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="60" y="116" fill="#75dece" font-family="Arial, sans-serif" font-size="16" font-weight="700">FIRECRACKER MICROVM</text>
    <rect x="65" y="144" width="142" height="111" rx="14" fill="#203842" stroke="#6a8791"/>
    <text x="136" y="183" text-anchor="middle" fill="#e5eef0" font-family="Arial, sans-serif" font-size="16">AI agent</text>
    <text x="136" y="211" text-anchor="middle" fill="#a8c0c7" font-family="Arial, sans-serif" font-size="14">command + code</text>
    <path d="M221 201H264" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M253 190L266 201L253 212" fill="none" stroke="#f5be58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="279" y="144" width="101" height="111" rx="14" fill="#203842" stroke="#6a8791"/>
    <text x="329" y="183" text-anchor="middle" fill="#e5eef0" font-family="Arial, sans-serif" font-size="15">Linux</text>
    <text x="329" y="209" text-anchor="middle" fill="#a8c0c7" font-family="Arial, sans-serif" font-size="13">workspace</text>
    <text x="220" y="291" text-anchor="middle" fill="#9eb3bb" font-family="Arial, sans-serif" font-size="14">guest terpisah dari host</text>
    <rect x="34" y="348" width="171" height="57" rx="14" fill="#27383a" stroke="#e5b94e"/>
    <text x="119" y="372" text-anchor="middle" fill="#f5d786" font-family="Arial, sans-serif" font-size="14" font-weight="700">EGRESS GATEWAY</text>
    <text x="119" y="392" text-anchor="middle" fill="#b8c6c6" font-family="Arial, sans-serif" font-size="12">kebijakan koneksi</text>
    <rect x="235" y="348" width="171" height="57" rx="14" fill="#27383a" stroke="#55c7b4"/>
    <text x="320" y="372" text-anchor="middle" fill="#a9f0df" font-family="Arial, sans-serif" font-size="14" font-weight="700">CREDENTIALS</text>
    <text x="320" y="392" text-anchor="middle" fill="#b8c6c6" font-family="Arial, sans-serif" font-size="12">disimpan di luar guest</text>
  </g>
  <text x="78" y="599" fill="#8da5ae" font-family="Arial, sans-serif" font-size="16">15 OKTOBER 2026 · INFRASTRUKTUR EKSEKUSI AGENT</text>
</svg>
