<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Muse Spark Open, model multimodal Meta dengan 816 miliar parameter</title>
  <desc id="desc">Ilustrasi konseptual menampilkan Muse Spark Open sebagai model multimodal dengan 816 miliar parameter total, 42 miliar aktif per token, dan konteks satu juta token.</desc>
