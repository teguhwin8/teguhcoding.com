  <text x="72" y="183" fill="#f5f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="760">Muse Spark Open</text>
  <text x="75" y="234" fill="#c4d1e2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">Bobot model untuk coding dan pekerjaan agent</text>
