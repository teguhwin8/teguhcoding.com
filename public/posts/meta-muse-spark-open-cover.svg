    <rect x="158" width="145" height="62" rx="16" fill="#243a59" stroke="#425b7b"/>
    <text x="176" y="27" fill="#91a9c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AKTIF / TOKEN</text>
    <text x="176" y="49" fill="#f3f6fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="750">42B</text>
