    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7cff"/><stop offset="1" stop-color="#46d6bf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050914" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <g opacity=".11" stroke="#b7c9dc" stroke-width="1">
