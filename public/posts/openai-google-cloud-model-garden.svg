<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Akses model OpenAI melalui Google Cloud</title>
  <desc id="desc">Pelanggan enterprise dapat mengakses model OpenAI melalui Model Garden. Workflow lokal Codex CLI dan Desktop dapat memakai Gemini platform Google Cloud untuk inferensi. Pembelian ditagihkan lewat Google Cloud Marketplace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10192e"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7183a8"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="64" y="74" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">JALUR AKSES MODEL</text>
  <text x="64" y="128" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="750">Model OpenAI lewat Google Cloud</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="54" y="190" width="310" height="220" rx="24" fill="#131e34" stroke="#33445f" stroke-width="2"/>
    <text x="84" y="238" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="1">PENGGUNA</text>
    <text x="84" y="291" fill="#f8fafc" font-size="27" font-weight="700">Developer</text>
    <text x="84" y="333" fill="#cbd5e1" font-size="21">API aplikasi</text>
    <text x="84" y="368" fill="#cbd5e1" font-size="21">Codex CLI / Desktop</text>

    <path d="M369 300h54" stroke="#7183a8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="435" y="190" width="330" height="220" rx="24" fill="#17233a" stroke="#5270a5" stroke-width="2"/>
    <text x="465" y="238" fill="#c4b5fd" font-size="18" font-weight="700" letter-spacing="1">PLATFORM</text>
    <text x="465" y="291" fill="#f8fafc" font-size="26" font-weight="700">Google Cloud</text>
    <text x="465" y="334" fill="#cbd5e1" font-size="21">Model Garden APIs</text>
    <text x="465" y="369" fill="#cbd5e1" font-size="21">Gemini platform untuk Codex</text>

    <path d="M770 300h54" stroke="#7183a8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="836" y="190" width="310" height="220" rx="24" fill="#131e34" stroke="#33445f" stroke-width="2"/>
    <text x="866" y="238" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="1">MODEL OPENAI</text>
    <text x="866" y="292" fill="#f8fafc" font-size="24" font-weight="700">GPT-6 Astra</text>
    <text x="866" y="333" fill="#f8fafc" font-size="24" font-weight="700">GPT-6.1 Sol</text>
    <text x="866" y="374" fill="#f8fafc" font-size="24" font-weight="700">GPT-6 Luna</text>

    <rect x="54" y="450" width="1092" height="96" rx="20" fill="#111b2d" stroke="#2d3e59" stroke-width="2"/>
    <circle cx="94" cy="498" r="13" fill="url(#accent)"/>
    <text x="126" y="490" fill="#f8fafc" font-size="23" font-weight="700">Tagihan melalui Google Cloud Marketplace</text>
    <text x="126" y="523" fill="#b7c4d9" font-size="20">Komitmen belanja GCP yang sudah ada dapat digunakan.</text>

    <rect x="54" y="574" width="1092" height="112" rx="20" fill="#12243a" stroke="#2d5877" stroke-width="2"/>
    <text x="84" y="615" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="1">STATUS 21 OKTOBER 2026</text>
    <text x="84" y="654" fill="#f8fafc" font-size="22">Private preview untuk enterprise tertentu; ketersediaan umum direncanakan beberapa pekan lagi.</text>
  </g>
</svg>
