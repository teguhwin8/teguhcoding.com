<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark latensi RIPL dari Liquid AI</title>
  <desc id="desc">Perbandingan latensi persentil ke-95 untuk dua skenario. Pada beban pendek, LFM2.5-1.2B dengan RIPL mencatat 34,6 milidetik dan Qwen3.5-0.8B dengan vLLM 498 milidetik. Pada beban lebih panjang, hasilnya 155,8 milidetik dan 4.431 milidetik.</desc>
  <rect width="1200" height="690" rx="28" fill="#f4f7fb"/>
  <text x="64" y="70" fill="#14212f" font-family="Arial, sans-serif" font-size="30" font-weight="700">Hasil benchmark RIPL</text>
  <text x="64" y="108" fill="#506174" font-family="Arial, sans-serif" font-size="18">Latensi p95 end-to-end · 1 GPU NVIDIA B200 · data dari pengujian Liquid AI</text>

  <rect x="54" y="145" width="532" height="455" rx="22" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>
  <rect x="614" y="145" width="532" height="455" rx="22" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>

  <text x="88" y="196" fill="#087e8b" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">BEBAN PENDEK</text>
  <text x="88" y="232" fill="#14212f" font-family="Arial, sans-serif" font-size="22" font-weight="700">32 token masuk → 32 keluar</text>
  <text x="88" y="261" fill="#506174" font-family="Arial, sans-serif" font-size="17">1.000 permintaan per detik</text>
  <line x1="88" y1="285" x2="552" y2="285" stroke="#e5ebf1" stroke-width="2"/>
  <text x="88" y="329" fill="#33475b" font-family="Arial, sans-serif" font-size="17">LFM2.5-1.2B · RIPL</text>
  <text x="88" y="373" fill="#087e8b" font-family="Arial, sans-serif" font-size="34" font-weight="700">34,6 ms</text>
  <text x="88" y="425" fill="#33475b" font-family="Arial, sans-serif" font-size="17">Qwen3.5-0.8B · vLLM</text>
  <text x="88" y="469" fill="#33475b" font-family="Arial, sans-serif" font-size="34" font-weight="700">498 ms</text>
  <rect x="88" y="520" width="190" height="42" rx="21" fill="#e2f4f3"/>
  <text x="112" y="547" fill="#086b74" font-family="Arial, sans-serif" font-size="17" font-weight="700">14,4× lebih rendah</text>

  <text x="648" y="196" fill="#087e8b" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">BEBAN LEBIH PANJANG</text>
  <text x="648" y="232" fill="#14212f" font-family="Arial, sans-serif" font-size="22" font-weight="700">256 token masuk → 128 keluar</text>
  <text x="648" y="261" fill="#506174" font-family="Arial, sans-serif" font-size="17">400 permintaan per detik</text>
  <line x1="648" y1="285" x2="1112" y2="285" stroke="#e5ebf1" stroke-width="2"/>
  <text x="648" y="329" fill="#33475b" font-family="Arial, sans-serif" font-size="17">LFM2.5-1.2B · RIPL</text>
  <text x="648" y="373" fill="#087e8b" font-family="Arial, sans-serif" font-size="34" font-weight="700">155,8 ms</text>
  <text x="648" y="425" fill="#33475b" font-family="Arial, sans-serif" font-size="17">Qwen3.5-0.8B · vLLM</text>
  <text x="648" y="469" fill="#33475b" font-family="Arial, sans-serif" font-size="34" font-weight="700">4.431 ms</text>
  <rect x="648" y="520" width="190" height="42" rx="21" fill="#e2f4f3"/>
  <text x="672" y="547" fill="#086b74" font-family="Arial, sans-serif" font-size="17" font-weight="700">28,4× lebih rendah</text>

  <text x="64" y="646" fill="#647487" font-family="Arial, sans-serif" font-size="15">Perbandingan mengganti model dan mesin inferensi sekaligus; hasilnya belum diverifikasi secara independen.</text>
</svg>
