<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Cara kerja dan hasil uji keamanan SPACE</title>
  <desc id="desc">Diagram konseptual yang menunjukkan guest microVM terpisah, gateway egress, kredensial di luar VM, dan ringkasan pengujian internal Perplexity.</desc>
  <rect width="1000" height="760" rx="26" fill="#f4f7f8"/>
  <text x="56" y="68" fill="#182c37" font-family="Arial, sans-serif" font-size="27" font-weight="700">Batas yang dijaga SPACE</text>
  <text x="56" y="101" fill="#60747d" font-family="Arial, sans-serif" font-size="16">Sandbox guest dipisahkan dari control plane, kebijakan jaringan, dan penyimpanan kredensial</text>
  <rect x="56" y="138" width="888" height="304" rx="22" fill="#eaf0f2" stroke="#cbd8dc" stroke-width="2"/>
  <text x="82" y="176" fill="#405862" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">HOST / CONTROL PLANE</text>
  <rect x="83" y="198" width="180" height="78" rx="14" fill="#ffffff" stroke="#80979f" stroke-width="2"/>
  <text x="173" y="231" text-anchor="middle" fill="#243d47" font-family="Arial, sans-serif" font-size="17" font-weight="700">Aplikasi</text>
  <text x="173" y="254" text-anchor="middle" fill="#61757d" font-family="Arial, sans-serif" font-size="14">HTTP API / SSE</text>
  <path d="M268 237H323" stroke="#138f83" stroke-width="4" stroke-linecap="round"/>
  <path d="M312 226L325 237L312 248" fill="none" stroke="#138f83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="335" y="198" width="239" height="78" rx="14" fill="#ffffff" stroke="#55a89f" stroke-width="2"/>
  <text x="454" y="231" text-anchor="middle" fill="#243d47" font-family="Arial, sans-serif" font-size="17" font-weight="700">SPACE control plane</text>
  <text x="454" y="254" text-anchor="middle" fill="#61757d" font-family="Arial, sans-serif" font-size="14">buat · jeda · lanjutkan</text>
  <rect x="607" y="198" width="145" height="78" rx="14" fill="#fffaf0" stroke="#d2a738" stroke-width="2"/>
  <text x="679" y="231" text-anchor="middle" fill="#665018" font-family="Arial, sans-serif" font-size="16" font-weight="700">Egress gate</text>
  <text x="679" y="254" text-anchor="middle" fill="#806e42" font-family="Arial, sans-serif" font-size="13">atur koneksi keluar</text>
  <rect x="782" y="198" width="135" height="78" rx="14" fill="#edfaf6" stroke="#49a993" stroke-width="2"/>
  <text x="849" y="231" text-anchor="middle" fill="#276b5d" font-family="Arial, sans-serif" font-size="15" font-weight="700">Vault</text>
  <text x="849" y="254" text-anchor="middle" fill="#54857b" font-family="Arial, sans-serif" font-size="13">secret di luar VM</text>
  <path d="M454 280V312H684V281M454 312H848V281" fill="none" stroke="#799098" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="335" y="321" width="417" height="91" rx="18" fill="#173b43" stroke="#1b9c8e" stroke-width="3"/>
  <text x="543" y="354" text-anchor="middle" fill="#80e4d3" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">FIRECRACKER MICROVM · GUEST</text>
  <text x="543" y="384" text-anchor="middle" fill="#f1f6f6" font-family="Arial, sans-serif" font-size="18">Agent menjalankan command dan kode di sini</text>
  <text x="56" y="493" fill="#182c37" font-family="Arial, sans-serif" font-size="23" font-weight="700">Hasil uji yang dilaporkan Perplexity</text>
  <rect x="56" y="520" width="274" height="155" rx="18" fill="#ffffff" stroke="#d2dde1" stroke-width="2"/>
  <text x="80" y="556" fill="#5d7079" font-family="Arial, sans-serif" font-size="15">VM-to-host escape</text>
  <text x="80" y="608" fill="#138f83" font-family="Arial, sans-serif" font-size="38" font-weight="700">0 / 108</text>
  <text x="80" y="644" fill="#6c7e86" font-family="Arial, sans-serif" font-size="14">percobaan berhasil</text>
  <rect x="363" y="520" width="274" height="155" rx="18" fill="#fffaf0" stroke="#ecd89f" stroke-width="2"/>
  <text x="387" y="556" fill="#76643a" font-family="Arial, sans-serif" font-size="15">Bypass egress sebelum fix</text>
  <text x="387" y="608" fill="#b67813" font-family="Arial, sans-serif" font-size="38" font-weight="700">11 / 54</text>
  <text x="387" y="644" fill="#87754c" font-family="Arial, sans-serif" font-size="14">uji dengan jaringan parsial</text>
  <rect x="670" y="520" width="274" height="155" rx="18" fill="#edfaf6" stroke="#b4dfd5" stroke-width="2"/>
  <text x="694" y="556" fill="#4d756c" font-family="Arial, sans-serif" font-size="15">Setelah perbaikan</text>
  <text x="694" y="608" fill="#138f83" font-family="Arial, sans-serif" font-size="38" font-weight="700">0</text>
  <text x="694" y="638" fill="#4d756c" font-family="Arial, sans-serif" font-size="15" font-weight="700">bypass terverifikasi</text>
  <text x="694" y="658" fill="#5f837b" font-family="Arial, sans-serif" font-size="13">pada pengujian ulang</text>
  <text x="56" y="715" fill="#6d7e86" font-family="Arial, sans-serif" font-size="14">Sumber angka: laporan internal Perplexity. Hasil terbatas pada cakupan uji, bukan audit independen.</text>
</svg>
