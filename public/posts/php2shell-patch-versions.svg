<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dua celah PHP2Shell dan versi PHP yang sudah diperbaiki</title>
  <desc id="desc">CVE-2026-109618 berkaitan dengan kerusakan memori saat kehabisan memori, sedangkan CVE-2026-109619 berkaitan dengan state lama yang dipakai ulang. Versi perbaikannya PHP 8.5.12, 8.4.27, 8.3.36, dan 8.2.35.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10192e"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#background)"/>
  <text x="56" y="64" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PEMBARUAN KEAMANAN PHP · 21 OKTOBER 2026</text>
  <text x="56" y="120" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750">Dua celah, empat versi bertambal</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="48" y="164" width="530" height="196" rx="22" fill="#171d30" stroke="#7f3345" stroke-width="2"/>
    <circle cx="88" cy="210" r="13" fill="#fb7185"/>
    <text x="116" y="216" fill="#fda4af" font-size="17" font-weight="700" letter-spacing="1">CVE-2026-109618</text>
    <text x="76" y="270" fill="#f8fafc" font-size="24" font-weight="700">Kehabisan memori merusak data PHP</text>
    <text x="76" y="312" fill="#cbd5e1" font-size="18">RCE tanpa autentikasi dibuktikan pada mod_php.</text>

    <rect x="48" y="384" width="530" height="196" rx="22" fill="#171d30" stroke="#78532c" stroke-width="2"/>
    <circle cx="88" cy="430" r="13" fill="#f59e0b"/>
    <text x="116" y="436" fill="#fcd34d" font-size="17" font-weight="700" letter-spacing="1">CVE-2026-109619</text>
    <text x="76" y="490" fill="#f8fafc" font-size="25" font-weight="700">Worker memakai ulang state lama</text>
    <text x="76" y="532" fill="#cbd5e1" font-size="18">Memori request lama dapat dipakai request berikutnya.</text>

    <path d="M592 372h38" stroke="#94a3b8" stroke-width="3"/>
    <path d="m622 362 14 10-14 10" fill="none" stroke="#94a3b8" stroke-width="3"/>

    <rect x="654" y="164" width="498" height="416" rx="22" fill="#122234" stroke="#316178" stroke-width="2"/>
    <text x="690" y="210" fill="#7dd3fc" font-size="17" font-weight="700" letter-spacing="1">VERSI PHP DENGAN PATCH</text>
    <rect x="688" y="244" width="198" height="98" rx="16" fill="#172b3e" stroke="#38536d"/>
    <text x="714" y="277" fill="#94a3b8" font-size="17">Cabang 8.5</text>
    <text x="714" y="318" fill="#f8fafc" font-size="31" font-weight="750">8.5.12</text>
    <rect x="920" y="244" width="198" height="98" rx="16" fill="#172b3e" stroke="#38536d"/>
    <text x="946" y="277" fill="#94a3b8" font-size="17">Cabang 8.4</text>
    <text x="946" y="318" fill="#f8fafc" font-size="31" font-weight="750">8.4.27</text>
    <rect x="688" y="364" width="198" height="98" rx="16" fill="#172b3e" stroke="#38536d"/>
    <text x="714" y="397" fill="#94a3b8" font-size="17">Cabang 8.3</text>
    <text x="714" y="438" fill="#f8fafc" font-size="31" font-weight="750">8.3.36</text>
    <rect x="920" y="364" width="198" height="98" rx="16" fill="#172b3e" stroke="#38536d"/>
    <text x="946" y="397" fill="#94a3b8" font-size="17">Cabang 8.2</text>
    <text x="946" y="438" fill="#f8fafc" font-size="31" font-weight="750">8.2.35</text>
    <rect x="688" y="484" width="430" height="62" rx="14" fill="#201c28" stroke="#60404b"/>
    <circle cx="714" cy="515" r="8" fill="url(#accent)"/>
    <text x="736" y="522" fill="#e2e8f0" font-size="17">8.1 ke bawah: cek backport vendor.</text>

    <rect x="48" y="620" width="1104" height="48" rx="16" fill="#111b2d" stroke="#3b4c62"/>
    <text x="76" y="651" fill="#cbd5e1" font-size="18">Pembaruan CMS tidak otomatis memperbarui runtime PHP.</text>
  </g>
</svg>
