<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Alur pencarian kode XERJ untuk coding agent</title>
  <desc id="desc">Folder proyek diindeks lokal, coding agent mengirim kueri, lalu XERJ mengembalikan fungsi yang cocok bersama nama file dan nomor baris.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f7f9"/><stop offset="1" stop-color="#e7f3f0"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22aa98"/><stop offset="1" stop-color="#538bd7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d3853" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7791a2"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <g stroke="#cfdee2" stroke-width="1" opacity=".55"><path d="M44 154h1112M44 210h1112M44 266h1112M44 322h1112M44 378h1112M44 434h1112M44 490h1112M44 546h1112M44 602h1112"/></g>
  <text x="60" y="70" fill="#20384e" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750">Dari folder proyek ke potongan kode yang dicari</text>
  <text x="60" y="104" fill="#617887" font-family="Inter, Arial, sans-serif" font-size="16">XERJ membuat indeks di mesin lokal, lalu memberi agent hasil dengan lokasi yang bisa dibuka.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="161" width="288" height="299" rx="22" fill="#fff" stroke="#d2e0e5" stroke-width="2"/>
    <rect x="60" y="161" width="288" height="58" rx="22" fill="#253c59"/>
    <path d="M60 198h288v21H60Z" fill="#253c59"/>
    <text x="86" y="197" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">1. Indeks folder</text>
    <text x="89" y="257" fill="#53877f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ xerj autoindex ./proyek</text>
    <g font-family="Inter, Arial, sans-serif" font-size="15">
      <rect x="88" y="281" width="231" height="42" rx="10" fill="#eff5f6"/><text x="106" y="308" fill="#496276">src/ · fungsi &amp; simbol</text>
      <rect x="88" y="333" width="231" height="42" rx="10" fill="#eff5f6"/><text x="106" y="360" fill="#496276">docs/ · halaman &amp; bagian</text>
      <rect x="88" y="385" width="231" height="42" rx="10" fill="#eff5f6"/><text x="106" y="412" fill="#496276">logs/ · berkas teks</text>
    </g>
  </g>

  <path d="M358 310h76" fill="none" stroke="#7791a2" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="448" y="161" width="302" height="299" rx="22" fill="#fff" stroke="#cde1df" stroke-width="2"/>
    <rect x="448" y="161" width="302" height="58" rx="22" fill="url(#teal)"/>
    <path d="M448 198h302v21H448Z" fill="url(#teal)"/>
    <text x="475" y="197" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">2. Agent bertanya</text>
    <rect x="477" y="254" width="244" height="91" rx="16" fill="#f1f7f8" stroke="#d8e4e7"/>
    <circle cx="503" cy="282" r="10" fill="#5191d8"/>
    <text x="524" y="286" fill="#315168" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Coding agent</text>
    <text x="496" y="319" fill="#556f7e" font-family="Inter, Arial, sans-serif" font-size="14">“Di mana kontrak fungsi</text>
    <text x="496" y="339" fill="#556f7e" font-family="Inter, Arial, sans-serif" font-size="14">yang memvalidasi token?”</text>
    <path d="M499 381h198" stroke="#d9e4e8" stroke-width="2"/>
    <text x="599" y="415" text-anchor="middle" fill="#617d88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">MCP · CLI · Elasticsearch API</text>
  </g>

  <path d="M760 310h76" fill="none" stroke="#7791a2" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="850" y="161" width="288" height="299" rx="22" fill="#fff" stroke="#d2e0e5" stroke-width="2"/>
    <rect x="850" y="161" width="288" height="58" rx="22" fill="#304860"/>
    <path d="M850 198h288v21H850Z" fill="#304860"/>
    <text x="877" y="197" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">3. Hasil berlokasi</text>
    <text x="879" y="258" fill="#637988" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">src/auth/token.rs:84</text>
    <rect x="878" y="276" width="230" height="106" rx="14" fill="#eaf7f3" stroke="#87c8b7" stroke-width="2"/>
    <text x="898" y="310" fill="#2f8e7d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">fn validate_token(...)</text>
    <text x="898" y="339" fill="#49675f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">// implementasi + kontrak</text>
    <text x="898" y="363" fill="#49675f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">// dalam satu potongan</text>
    <text x="993" y="421" text-anchor="middle" fill="#627b89" font-family="Inter, Arial, sans-serif" font-size="14">Bukan seluruh file</text>
  </g>

  <rect x="60" y="510" width="1078" height="96" rx="20" fill="#203950"/>
  <text x="599" y="550" text-anchor="middle" fill="#eef5f8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Penghematan terbesar muncul ketika agent belum mengenal API atau codebase itu.</text>
  <text x="599" y="579" text-anchor="middle" fill="#b9cad3" font-family="Inter, Arial, sans-serif" font-size="14">Kinerja pencarian tetap bergantung pada relevansi indeks dan jenis tugas.</text>
  <text x="60" y="650" fill="#758a98" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="1">DIAGRAM KONSEPTUAL TEGUHCODING · DIRINGKAS DARI DOKUMENTASI XERJ</text>
</svg>
