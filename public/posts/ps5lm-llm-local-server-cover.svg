<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PS5LM: server LLM lokal dari konsol PS5</title>
  <desc id="desc">Ilustrasi konseptual konsol game sebagai server model AI lokal untuk perangkat di jaringan rumah.</desc>
