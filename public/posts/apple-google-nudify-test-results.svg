<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="56" y1="42" x2="1144" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3EE"/>
