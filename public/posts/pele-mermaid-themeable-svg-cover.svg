<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pele merender sintaks Mermaid menjadi diagram SVG bertema</title>
  <desc id="desc">Ilustrasi konsep menampilkan potongan sintaks Mermaid yang masuk ke renderer Pele dan menjadi diagram SVG dengan warna yang dapat mengikuti tema aplikasi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b34"/><stop offset="1" stop-color="#1c344e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42d5b2"/><stop offset="1" stop-color="#60a7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020711" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <g opacity=".1" stroke="#aac2dd" stroke-width="1">
    <path d="M0 70h1200M0 118h1200M0 166h1200M0 214h1200M0 262h1200M0 310h1200M0 358h1200M0 406h1200M0 454h1200M0 502h1200M0 550h1200M0 598h1200"/>
    <path d="M48 0v630M96 0v630M144 0v630M192 0v630M240 0v630M288 0v630M336 0v630M384 0v630M432 0v630M480 0v630M528 0v630M576 0v630M624 0v630M672 0v630M720 0v630M768 0v630M816 0v630M864 0v630M912 0v630M960 0v630M1008 0v630M1056 0v630M1104 0v630M1152 0v630"/>
  </g>
  <circle cx="1050" cy="142" r="190" fill="#45d5b5" opacity=".08"/>
  <circle cx="1095" cy="467" r="222" fill="#609df2" opacity=".08"/>
  <text x="72" y="83" fill="#8be8d0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">LIBRARY OPEN SOURCE DARI OBSIDIAN</text>
  <text x="72" y="170" fill="#f3f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="760">Diagram Mermaid,</text>
  <text x="72" y="236" fill="#f3f7fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="760">tampilan lebih luwes</text>
  <text x="75" y="291" fill="#bdcde0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Pele merender sintaks menjadi SVG yang mengikuti tema aplikasi.</text>
  <g transform="translate(75 364)">
    <rect width="167" height="48" rx="24" fill="#203a59" stroke="#41607c"/>
    <circle cx="25" cy="24" r="6" fill="#55d9b8"/>
    <text x="43" y="30" fill="#e5f3f4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Pele · MIT</text>
  </g>
  <text x="75" y="468" fill="#d9e7f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">flowchart LR</text>
  <text x="75" y="497" fill="#86d9c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">A[Mermaid] --&gt; B[SVG]</text>
  <g filter="url(#shadow)">
    <rect x="703" y="100" width="428" height="400" rx="30" fill="#f5f8fc"/>
    <rect x="730" y="126" width="374" height="66" rx="17" fill="#192d48"/>
    <circle cx="755" cy="151" r="5" fill="#fa8d8d"/><circle cx="775" cy="151" r="5" fill="#f3c875"/><circle cx="795" cy="151" r="5" fill="#6bd1ae"/>
    <text x="752" y="178" fill="#c4d5e6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">const { svg } = render(source)</text>
    <rect x="730" y="211" width="374" height="261" rx="20" fill="#edf4f4" stroke="#d9e4e9"/>
    <path d="M774 273h58" stroke="#798ea7" stroke-width="3" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#798ea7"/></marker></defs>
    <rect x="759" y="290" width="86" height="54" rx="14" fill="#d9edeb" stroke="#97c9c1"/>
    <text x="802" y="322" text-anchor="middle" fill="#316f70" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Mermaid</text>
    <path d="M855 317h58" stroke="#798ea7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="922" y="278" width="119" height="78" rx="18" fill="url(#accent)"/>
    <text x="981" y="311" text-anchor="middle" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="750">Pele</text>
    <text x="981" y="335" text-anchor="middle" fill="#e9f8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">renderer SVG</text>
    <path d="M981 366v34" stroke="#798ea7" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="918" y="410" width="126" height="42" rx="12" fill="#fff" stroke="#cad8e2"/>
    <path d="M935 425h35M935 434h54M1003 426h24" stroke="#66a69b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1028" cy="436" r="5" fill="#5d9dea"/>
    <text x="802" y="379" text-anchor="middle" fill="#75889d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">teks diagram</text>
    <text x="981" y="466" text-anchor="middle" fill="#667b91" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">warna dari CSS variables</text>
  </g>
  <rect x="75" y="560" width="1056" height="1" fill="#4a647e" opacity=".75"/>
  <text x="75" y="590" fill="#8ea3ba" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">TEGUHCODING.COM  ·  ILUSTRASI KONSEPTUAL, BUKAN TANGKAPAN LAYAR</text>
</svg>
