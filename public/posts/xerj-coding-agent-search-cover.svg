    <text x="867" y="411" fill="#43665f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">// fungsi dan konteksnya</text>
    <text x="867" y="435" fill="#43665f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">// siap dibaca agent</text>
    <text x="852" y="475" fill="#566f81" font-family="Inter, Arial, sans-serif" font-size="14">Potongan kode, bukan dump seluruh repo</text>
