    <text x="92" y="301" fill="#c5d6e0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">FOLDER PROYEK</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
