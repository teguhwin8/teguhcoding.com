      <rect x="91" y="374" width="198" height="38" rx="9" fill="#213a50"/><text x="108" y="399" fill="#a9c5ff">docs/</text>
      <rect x="91" y="423" width="198" height="38" rx="9" fill="#213a50"/><text x="108" y="448" fill="#e5c98b">tests/</text>
    </g>
    <circle cx="277" cy="338" r="5" fill="#39c9ae"/><circle cx="277" cy="387" r="5" fill="#719dff"/><circle cx="277" cy="436" r="5" fill="#e8bd6d"/>
