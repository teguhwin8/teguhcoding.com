<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">XERJ membantu coding agent mencari bagian kode yang relevan</title>
  <desc id="desc">Ilustrasi konseptual folder kode yang diindeks secara lokal dan mengirim satu fungsi yang relevan ke coding agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d32"/><stop offset="1" stop-color="#1b3e4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31c6ae"/><stop offset="1" stop-color="#67a8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06111f" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8aa8bd"/></marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <g opacity=".12" stroke="#9bb8c8" stroke-width="1"><path d="M45 90h1110M45 145h1110M45 200h1110M45 255h1110M45 310h1110M45 365h1110M45 420h1110M45 475h1110M45 530h1110"/><path d="M80 40v550M150 40v550M220 40v550M290 40v550M360 40v550M430 40v550M500 40v550M570 40v550M640 40v550M710 40v550M780 40v550M850 40v550M920 40v550M990 40v550M1060 40v550M1130 40v550"/></g>
  <text x="64" y="75" fill="#8fdcca" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">PENCARIAN LOKAL UNTUK CODING AGENT</text>
  <text x="64" y="126" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">Cari fungsinya.</text>
  <text x="64" y="168" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">Tak perlu baca seluruh repo.</text>
  <text x="64" y="205" fill="#afc4d0" font-family="Inter, Arial, sans-serif" font-size="16">Indeks lokal mengembalikan kode yang relevan beserta lokasinya.</text>

