<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Alur kerja agen AI pada platform Cairn menurut laporan NorForge</title>
  <desc id="desc">Operator manusia menentukan target dan tujuan. Cairn mengoordinasikan agen yang bekerja melalui langkah-langkah dan membagikan temuan di papan bersama. Operator dapat memberi petunjuk tambahan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 30px system-ui,-apple-system,sans-serif;fill:#0f172a}
      .label{font:700 21px system-ui,-apple-system,sans-serif;fill:#0f172a}
      .copy{font:16px system-ui,-apple-system,sans-serif;fill:#334155}
      .note{font:15px system-ui,-apple-system,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="56" y="62" class="title">Siapa melakukan apa?</text>

  <rect x="56" y="130" width="240" height="210" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="94" cy="176" r="18" fill="#dbeafe"/>
  <circle cx="94" cy="169" r="5" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M84 185c2-8 18-8 20 0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="82" y="225" class="label">Operator manusia</text>
  <text x="82" y="260" class="copy"><tspan x="82" dy="0">Menentukan sasaran</tspan><tspan x="82" dy="25">dan tujuan; dapat</tspan><tspan x="82" dy="25">menambah petunjuk.</tspan></text>

  <path d="M310 235h64" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="390" y="130" width="370" height="210" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="420" y="184" class="label">Cairn mengoordinasikan agen</text>
  <rect x="420" y="210" width="145" height="84" rx="12" fill="#fff" stroke="#bfdbfe"/>
  <text x="443" y="244" class="copy">Agen bekerja</text>
  <text x="443" y="269" class="copy">bertahap</text>
  <path d="M580 252h34" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="626" y="210" width="104" height="84" rx="12" fill="#fff" stroke="#bfdbfe"/>
  <text x="642" y="244" class="copy">Papan</text>
  <text x="642" y="269" class="copy">temuan</text>

  <path d="M774 235h64" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="854" y="130" width="290" height="210" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="894" cy="176" r="18" fill="#fee2e2"/>
  <circle cx="894" cy="176" r="9" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="894" cy="176" r="3" fill="#dc2626"/>
  <text x="882" y="225" class="label">Situs sasaran</text>
  <text x="882" y="260" class="copy"><tspan x="882" dy="0">Dalam kasus ini,</tspan><tspan x="882" dy="25">diuji tanpa izin</tspan><tspan x="882" dy="25">operator situs.</tspan></text>

  <path d="M575 340v70H176v-50" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="395" y="452" class="note">Temuan agen kembali ke papan; operator dapat memberi arahan lanjutan</text>
  <text x="56" y="495" class="note">Ringkasan berdasarkan laporan NorForge — bukan diagram asli dari Cairn.</text>
</svg>
