    <text x="513" y="309" fill="#304563" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Model open-weight</text>
    <text x="513" y="332" fill="#697b93" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">percakapan dan beberapa agent</text>
    <rect x="438" y="372" width="324" height="78" rx="18" fill="#f0f8f6" stroke="#d2eae4"/>
    <rect x="455" y="391" width="42" height="40" rx="9" fill="#daf2ed"/>
    <path d="M465 403h22M465 411h22M465 419h14" stroke="#318c7c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="513" y="405" fill="#304563" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Alat komputasi ilmiah</text>
    <text x="513" y="428" fill="#697b93" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Lean · Mathlib · SageMath · SymPy</text>
    <rect x="438" y="466" width="324" height="40" rx="13" fill="#f5f1ff"/>
    <circle cx="461" cy="486" r="6" fill="#8b74dc"/><circle cx="481" cy="486" r="6" fill="#8b74dc" opacity=".7"/><circle cx="501" cy="486" r="6" fill="#8b74dc" opacity=".45"/>
    <text x="523" y="491" fill="#5c5189" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">agent mengusulkan pendekatan</text>
  </g>

  <path d="M817 352h63" fill="none" stroke="#788bab" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="903" y="202" width="226" height="300" rx="24" fill="#fff" stroke="#d7e0ed"/>
    <rect x="903" y="202" width="226" height="68" rx="24" fill="#26395d"/>
    <path d="M903 246h226v24H903Z" fill="#26395d"/>
    <circle cx="944" cy="236" r="16" fill="#7d9bc9"/>
    <path d="M916 285c4-22 15-33 28-33s24 11 28 33" fill="#9bb1d5"/>
    <text x="990" y="232" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Peneliti</text>
    <text x="990" y="255" fill="#c9d6ed" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">meninjau hasil</text>
    <circle cx="1016" cy="356" r="45" fill="#e6f6f1"/>
    <path d="M994 357l15 15 30-34" fill="none" stroke="#268b71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1016" y="432" text-anchor="middle" fill="#334663" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Validasi dan keputusan</text>
    <text x="1016" y="458" text-anchor="middle" fill="#66758b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">tetap di tangan matematikawan</text>
  </g>

  <rect x="70" y="571" width="1059" height="78" rx="20" fill="#172c52"/>
  <text x="600" y="603" text-anchor="middle" fill="#e8f0ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Alur konseptual berdasarkan fitur yang dijelaskan SAIR</text>
  <text x="600" y="628" text-anchor="middle" fill="#aabada" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Bukan gambaran antarmuka produk atau jaminan bahwa setiap usulan AI benar.</text>
</svg>
