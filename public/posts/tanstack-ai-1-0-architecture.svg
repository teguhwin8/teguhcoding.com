<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Susunan TanStack AI 1.0</title>
  <desc id="desc">Aplikasi TypeScript terhubung melalui API inti TanStack AI yang stabil ke berbagai provider model. Agent harness ditandai eksperimental.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .label{fill:#cbd5e1;font-size:17px}
      .small{fill:#94a3b8;font-size:14px}
      .strong{fill:#f8fafc;font-size:22px;font-weight:700}
    </style>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <text x="56" y="66" fill="#5eead4" font-size="14" font-weight="700" letter-spacing="2">PETA EKOSISTEM</text>
  <text x="56" y="108" fill="#f8fafc" font-size="30" font-weight="750">TanStack AI 1.0</text>
  <text x="56" y="139" class="label">Pilih stack aplikasi dan provider yang sesuai kebutuhan.</text>

  <rect x="56" y="184" width="234" height="104" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="222" class="strong">Aplikasi Anda</text>
  <text x="80" y="252" class="small">TypeScript · UI · backend</text>
  <text x="80" y="273" class="small">React, Vue, Svelte, dan lainnya</text>

  <path d="M300 236h55" stroke="#64748b" stroke-width="3"/>
  <path d="m347 228 10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="366" y="174" width="258" height="124" rx="20" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
  <rect x="380" y="188" width="230" height="96" rx="14" fill="url(#core)" opacity=".18"/>
  <text x="398" y="220" class="strong">TanStack AI</text>
  <text x="398" y="248" fill="#ccfbf1" font-size="16" font-weight="650">API inti stabil · 1.0</text>
  <text x="398" y="272" fill="#ccfbf1" font-size="14">chat · tools · media · MCP</text>

  <path d="M634 236h55" stroke="#64748b" stroke-width="3"/>
  <path d="m681 228 10 8-10 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="700" y="184" width="204" height="104" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="724" y="222" class="strong">Provider</text>
  <text x="724" y="252" class="small">23 adapter model</text>
  <text x="724" y="273" class="small">11 penyedia sandbox</text>

  <path d="M495 309v37" stroke="#64748b" stroke-width="3" stroke-dasharray="6 7"/>
  <path d="m487 340 8 10 8-10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="224" y="360" width="512" height="104" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="256" y="399" fill="#fde68a" font-size="20" font-weight="700">Agent harness · eksperimental (0.x)</text>
  <text x="256" y="430" class="label">Sesi panjang, subagent, plugin, dan pekerjaan latar.</text>
  <text x="56" y="492" class="small">Status core 1.0 tidak otomatis membuat harness ikut stabil.</text>
</svg>
