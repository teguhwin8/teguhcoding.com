<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1040" viewBox="0 0 800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Bagaimana MONST3R-AI menggunakan API key curian</title>
  <desc id="desc">Diagram konseptual tiga langkah: key AI curian dipakai dalam panel pentest otomatis, lalu biaya API dibebankan kepada pemilik key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11182b"/><stop offset="1" stop-color="#20294c"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffba6a"/><stop offset=".55" stop-color="#ff8a68"/><stop offset="1" stop-color="#73dbea"/></linearGradient>
  </defs>
  <rect width="800" height="1040" rx="26" fill="url(#bg)"/>
  <text x="42" y="54" fill="#77deeb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ALUR YANG DILAPORKAN • ILUSTRASI</text>
  <text x="42" y="104" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Key curian bisa membiayai</text>
  <text x="42" y="143" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">pemindaian otomatis</text>

  <rect x="42" y="182" width="716" height="184" rx="20" fill="#202b4b" stroke="#5e6d90" stroke-width="2"/>
  <circle cx="86" cy="222" r="22" fill="#614650"/><text x="79" y="230" fill="#ffd294" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">1</text>
  <g transform="translate(82 255) rotate(-25 52 35)" fill="none" stroke="#ffc476" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="33" r="23"/><path d="M57 51l48 48m-18-19 12-12m-1 31 13-13"/></g>
  <text x="230" y="236" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Key penyedia AI dicuri</text>
  <text x="230" y="282" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">OpenAI, Anthropic, atau Google</text>
  <text x="230" y="316" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">key masih bisa dipakai sampai dicabut.</text>

  <path d="M400 374v36m-12-14 12 14 12-14" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="42" y="422" width="716" height="184" rx="20" fill="#202b4b" stroke="#5e6d90" stroke-width="2"/>
  <circle cx="86" cy="462" r="22" fill="#614650"/><text x="79" y="470" fill="#ffd294" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2</text>
  <rect x="82" y="501" width="104" height="65" rx="11" fill="#141d36" stroke="#64769f" stroke-width="2"/>
  <path d="M99 520h70m-70 15h52m-52 15h62" stroke="#86dfea" stroke-width="5" stroke-linecap="round"/>
  <text x="230" y="476" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Panel MONST3R-AI</text>
  <text x="230" y="522" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">Pembeli memasukkan key, target,</text>
  <text x="230" y="556" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">dan batas biaya pemakaian.</text>

  <path d="M400 614v36m-12-14 12 14 12-14" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="42" y="662" width="716" height="184" rx="20" fill="#202b4b" stroke="#5e6d90" stroke-width="2"/>
  <circle cx="86" cy="702" r="22" fill="#31515e"/><text x="79" y="710" fill="#91edf1" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">3</text>
  <g transform="translate(82 741)" fill="none" stroke="#73dbea" stroke-width="4"><circle cx="50" cy="38" r="32"/><path d="M50 16v45m-14-22h28M113 8h47v60h-47zM123 25h27m-27 13h27m-27 13h18"/><path d="M83 38h24" stroke-dasharray="5 6"/></g>
  <text x="260" y="716" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Tagihan masuk ke pemilik key</text>
  <text x="260" y="762" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">Provider memproses penggunaan API</text>
  <text x="260" y="796" fill="#c3cee7" font-family="Arial, Helvetica, sans-serif" font-size="22">atas akun pemilik kredensial.</text>

  <rect x="42" y="878" width="716" height="112" rx="17" fill="#302840" stroke="#896259" stroke-width="2"/>
  <text x="68" y="918" fill="#ffc477" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Klaim dashboard penjual</text>
  <text x="68" y="957" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="21">1.072 temuan / 199 host — belum diverifikasi Bitsight.</text>
  <text x="42" y="1022" fill="#91a0c2" font-family="Arial, Helvetica, sans-serif" font-size="16">Sumber: laporan Bitsight, 15 Oktober 2026. Diagram bukan bukti hasil serangan.</text>
</svg>
