<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <rect width="1100" height="420" fill="#f8fafc"/>
  <text x="550" y="55" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">NGINX2Root dalam satu gambar</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0f172a">
    <rect x="40" y="90" width="490" height="200" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="65" y="130" font-weight="bold" font-size="22">5 celah, syarat berbeda</text>
    <text x="65" y="165">• 123007 — HTTP/2 aktif (major)</text>
    <text x="65" y="195">• 123633 — HTTP/2 + proxy upstream</text>
    <text x="65" y="225">• 121810 — HTTP/3 + proxy upstream</text>
    <text x="65" y="255">• 123634 — resolver + mirror khusus</text>
    <text x="65" y="285">• 113425 — mail proxy (major)</text>
    <rect x="570" y="90" width="490" height="200" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="595" y="130" font-weight="bold" font-size="22">2 jalur penanganan</text>
    <text x="595" y="165">1. Upgrade ke 1.30.7 / 1.31.9</text>
    <text x="595" y="195">   lalu RESTART (bukan reload)</text>
    <text x="595" y="235">2. Belum bisa upgrade?</text>
    <text x="595" y="265">   Matikan HTTP/2 + HTTP/3,</text>
    <text x="595" y="290">   verifikasi ALPN &amp; UDP 443</text>
  </g>
  <text x="550" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Versi rentan utama: nginx 1.9.5 – 1.31.8 (CVE-2026-123007)</text>
  <text x="550" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">Sumber: advisory resmi nginx &amp; ringkasan Cycode, 18 November 2026</text>
</svg>
