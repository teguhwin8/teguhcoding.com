    <text x="140" y="236" fill="#cfdaeb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">pembelajaran formal</text>
    <text x="89" y="299" fill="#304763" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Contoh materi yang disebut:</text>
    <rect x="89" y="319" width="250" height="40" rx="12" fill="#edf3fb"/>
    <text x="106" y="344" fill="#526a88" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Machine Learning in Production</text>
    <rect x="89" y="370" width="250" height="48" rx="12" fill="#edf3fb"/>
    <text x="106" y="391" fill="#526a88" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">AI-Augmented Software</text>
    <text x="106" y="407" fill="#526a88" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Engineering</text>
  </g>
  <path d="M382 314h42" fill="none" stroke="#748ba6" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="450" y="181" width="300" height="270" rx="24" fill="#fff" stroke="#c8dfdd"/>
    <rect x="450" y="181" width="300" height="74" rx="24" fill="url(#accent)"/>
    <path d="M450 230h300v25H450Z" fill="url(#accent)"/>
