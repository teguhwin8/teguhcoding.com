<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tiga unsur pembelajaran dalam program PRAISE</title>
  <desc id="desc">Kelas CMU, bimbingan preceptor senior, dan praktik kerja di Microsoft saling melengkapi untuk membantu peserta mengembangkan kemampuan rekayasa perangkat lunak berbantuan AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f7fb"/><stop offset="1" stop-color="#e8f4f3"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#139d98"/><stop offset="1" stop-color="#3977ba"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#263e66" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#748ba6"/></marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#cbd9e6" stroke-width="1.5" opacity=".5">
    <path d="M40 64h1120M40 108h1120M40 152h1120M40 196h1120M40 240h1120M40 284h1120M40 328h1120M40 372h1120M40 416h1120M40 460h1120M40 504h1120M40 548h1120M40 592h1120M40 636h1120"/>
  </g>
  <text x="64" y="76" fill="#203a59" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="740">Bagaimana PRAISE menghubungkan belajar dan kerja</text>
  <text x="64" y="108" fill="#62758b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Tiga unsur yang disebut Microsoft dan CMU dalam program untuk peserta terpilih.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="181" width="300" height="270" rx="24" fill="#fff" stroke="#d7e1ea"/>
    <rect x="64" y="181" width="300" height="74" rx="24" fill="#233859"/>
