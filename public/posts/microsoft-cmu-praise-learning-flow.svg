    <text x="925" y="236" fill="#d4e0ed" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">penerapan di Microsoft</text>
    <text x="861" y="299" fill="#304763" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Pengetahuan dipakai pada:</text>
    <rect x="861" y="319" width="250" height="99" rx="15" fill="#f1f6f9"/>
    <path d="M882 343h28M882 356h47M882 369h38" stroke="#8ea6bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1071" cy="359" r="23" fill="#d7eee9"/>
    <path d="M1060 359l8 8 15-18" fill="none" stroke="#278e7b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="986" y="401" text-anchor="middle" fill="#5b6e84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">pekerjaan sehari-hari</text>
  </g>
  <rect x="64" y="500" width="1072" height="104" rx="22" fill="#1e3452"/>
  <text x="600" y="539" text-anchor="middle" fill="#e7f1fb" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Tujuan: kemampuan rekayasa, pertimbangan, dan tanggung jawab</text>
  <text x="600" y="571" text-anchor="middle" fill="#b3c5d8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Rangkuman pendekatan yang dijelaskan penyelenggara; belum merupakan hasil evaluasi program.</text>
  <text x="64" y="649" fill="#77899e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">ILUSTRASI KONSEPTUAL TEGUHCODING  ·  BUKAN BAGAN RESMI PRAISE</text>
</svg>
