    <text x="526" y="214" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Mentor senior</text>
    <text x="526" y="236" fill="#d8f2ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">preceptor di tempat kerja</text>
    <text x="475" y="299" fill="#304763" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Membantu peserta:</text>
    <circle cx="487" cy="334" r="5" fill="#31a293"/><text x="504" y="339" fill="#5b6e84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">menguji asumsi</text>
    <circle cx="487" cy="371" r="5" fill="#31a293"/><text x="504" y="376" fill="#5b6e84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">memahami perubahan AI</text>
    <circle cx="487" cy="408" r="5" fill="#31a293"/><text x="504" y="413" fill="#5b6e84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">belajar melalui praktik</text>
  </g>
  <path d="M768 314h42" fill="none" stroke="#748ba6" stroke-width="3" marker-end="url(#arrow)"/>
