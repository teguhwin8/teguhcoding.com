<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Alur kerja OpenFilm dari coding agent ke video yang bisa diedit</title>
  <desc id="desc">Coding agent menulis proyek film dari file HTML dan media, OpenFilm Studio menampilkan preview dan timeline untuk diedit, lalu CLI merender dan mengekspor video.</desc>
  <rect width="1200" height="490" rx="28" fill="#101827"/>
  <text x="56" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Film tetap berupa proyek yang bisa dibuka dan diubah</text>
  <text x="56" y="105" fill="#9caec5" font-family="Arial, sans-serif" font-size="17">Agent mengerjakan drafnya; Studio menyediakan tempat untuk meninjau dan menyunting hasil.</text>

  <rect x="56" y="155" width="315" height="258" rx="20" fill="#172337" stroke="#334155" stroke-width="2"/>
  <circle cx="91" cy="194" r="18" fill="#2563eb"/>
  <text x="91" y="201" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
  <text x="122" y="201" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="700">Coding agent</text>
  <text x="84" y="250" fill="#93c5fd" font-family="Arial, sans-serif" font-size="17">Codex · Claude Code · lainnya</text>
  <text x="84" y="294" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Menerima brief, lalu menulis</text>
  <text x="84" y="320" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">adegan, kode, dan aset film.</text>
  <rect x="84" y="348" width="118" height="34" rx="8" fill="#0f172a"/>
  <text x="143" y="370" fill="#7dd3fc" font-family="monospace" font-size="15" text-anchor="middle">film.html</text>
  <rect x="211" y="348" width="132" height="34" rx="8" fill="#0f172a"/>
  <text x="277" y="370" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">media</text>

  <path d="M388 284h30m-9-10 10 10-10 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="443" y="155" width="315" height="258" rx="20" fill="#172337" stroke="#334155" stroke-width="2"/>
  <circle cx="478" cy="194" r="18" fill="#7c3aed"/>
  <text x="478" y="201" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
  <text x="509" y="201" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="700">OpenFilm Studio</text>
  <rect x="477" y="236" width="246" height="84" rx="10" fill="#0b1220" stroke="#334155"/>
  <rect x="490" y="248" width="135" height="60" rx="6" fill="#1d4ed8"/>
  <path d="M503 294l29-30 22 20 14-12 43 36" fill="#7dd3fc" opacity=".8"/>
  <rect x="635" y="248" width="74" height="8" rx="4" fill="#475569"/>
  <rect x="635" y="264" width="57" height="8" rx="4" fill="#334155"/>
  <rect x="635" y="280" width="66" height="8" rx="4" fill="#334155"/>
  <rect x="477" y="338" width="246" height="11" rx="5" fill="#334155"/>
  <rect x="477" y="338" width="131" height="11" rx="5" fill="#38bdf8"/>
  <rect x="618" y="338" width="92" height="11" rx="5" fill="#a78bfa"/>
  <text x="477" y="378" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Preview dan timeline</text>
  <text x="477" y="402" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Edit manual atau lewat agent</text>

  <path d="M775 284h30m-9-10 10 10-10 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="830" y="155" width="315" height="258" rx="20" fill="#172337" stroke="#334155" stroke-width="2"/>
  <circle cx="865" cy="194" r="18" fill="#059669"/>
  <text x="865" y="201" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
  <text x="896" y="201" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="21" font-weight="700">Render dan ekspor</text>
  <rect x="879" y="245" width="217" height="112" rx="14" fill="#0b1220" stroke="#334155"/>
  <path d="M930 273l46 28-46 28z" fill="#34d399"/>
  <text x="1010" y="294" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Frame diproses</text>
  <text x="1010" y="321" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">jadi video</text>
  <text x="987" y="385" fill="#a7f3d0" font-family="monospace" font-size="14" text-anchor="middle">openfilm render → MP4</text>
</svg>
