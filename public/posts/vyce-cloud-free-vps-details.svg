<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ringkasan paket gratis Vyce Cloud</title>
  <desc id="desc">Paket Vyce Mini menawarkan satu vCore, RAM 2 GB, dan NVMe 6 GB. Server perlu diperpanjang setiap hari; bila berhenti selama tiga hari, server dihapus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="94" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700">Vyce Cloud · Vps-Mini</text>
  <text x="72" y="137" fill="#9fb0c7" font-family="Inter,Arial,sans-serif" font-size="21">Spesifikasi dan aturan paket gratis yang perlu diingat</text>
  <rect x="72" y="184" width="1056" height="210" rx="24" fill="#111c2e" stroke="#2c3c54"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="104" y="218" width="296" height="142" rx="18" fill="#17283d"/>
    <text x="252" y="282" fill="#f8fafc" font-size="43" font-weight="700">1 vCore</text>
    <text x="252" y="326" fill="#a9bbd2" font-size="20">CPU virtual</text>
    <rect x="452" y="218" width="296" height="142" rx="18" fill="#17283d"/>
    <text x="600" y="282" fill="#f8fafc" font-size="43" font-weight="700">2 GB</text>
    <text x="600" y="326" fill="#a9bbd2" font-size="20">RAM</text>
    <rect x="800" y="218" width="296" height="142" rx="18" fill="#17283d"/>
    <text x="948" y="282" fill="#f8fafc" font-size="43" font-weight="700">6 GB</text>
    <text x="948" y="326" fill="#a9bbd2" font-size="20">penyimpanan NVMe</text>
  </g>
  <text x="72" y="464" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">Siklus server</text>
  <path d="M178 548H1010" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="182" cy="548" r="15" fill="#38bdf8"/>
    <text x="182" y="510" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Perpanjang</text>
    <text x="182" y="590" text-anchor="middle" fill="#b5c3d5" font-size="18">setiap hari</text>
    <circle cx="600" cy="548" r="15" fill="#818cf8"/>
    <text x="600" y="510" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Terlewat</text>
    <text x="600" y="590" text-anchor="middle" fill="#b5c3d5" font-size="18">server berhenti</text>
    <circle cx="1014" cy="548" r="15" fill="#fb7185"/>
    <text x="1014" y="510" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">3 hari berhenti</text>
    <text x="1014" y="590" text-anchor="middle" fill="#b5c3d5" font-size="18">server dihapus</text>
  </g>
  <text x="72" y="668" fill="#7f91a8" font-family="Inter,Arial,sans-serif" font-size="16">Sumber: spesifikasi dan FAQ Vyce Cloud · diperiksa 21 Oktober 2026</text>
</svg>
