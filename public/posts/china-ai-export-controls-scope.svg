<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Apa yang masuk dan tidak masuk dalam rancangan kontrol ekspor teknologi AI China</title>
  <desc id="desc">Diagram yang memisahkan akses lewat API dan teknologi yang sudah masuk domain publik dari transfer teknologi dan deployment model secara lokal di luar negeri.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d32"/><stop offset="1" stop-color="#1b3e4b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06111f" flood-opacity=".28"/></filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#55c6a9"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e2b65f"/></marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <g opacity=".1" stroke="#9bb8c8" stroke-width="1"><path d="M45 90h1110M45 145h1110M45 200h1110M45 255h1110M45 310h1110M45 365h1110M45 420h1110M45 475h1110M45 530h1110"/><path d="M80 40v550M150 40v550M220 40v550M290 40v550M360 40v550M430 40v550M500 40v550M570 40v550M640 40v550M710 40v550M780 40v550M850 40v550M920 40v550M990 40v550M1060 40v550M1130 40v550"/></g>
  <text x="64" y="74" fill="#8fdcca" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CARA MEMBACA RANCANGAN</text>
  <text x="64" y="124" fill="#f4f8fb" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750">Aturan berpusat pada perpindahan teknologi</text>
  <text x="64" y="158" fill="#afc4d0" font-family="Inter, Arial, sans-serif" font-size="16">Layanan model dan transfer teknologinya diperlakukan berbeda.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="222" width="260" height="216" rx="22" fill="#172b41" stroke="#476176" stroke-width="2"/>
    <circle cx="195" cy="289" r="34" fill="#1b4b52" stroke="#55c6a9" stroke-width="2"/>
    <path d="M181 289h28M195 275v28M185 279l20 20M205 279l-20 20" stroke="#83e0c2" stroke-width="3" stroke-linecap="round"/>
    <text x="195" y="357" text-anchor="middle" fill="#edf5f8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Model AI di China</text>
    <text x="195" y="385" text-anchor="middle" fill="#aac0ce" font-family="Inter, Arial, sans-serif" font-size="14">bobot · kode · layanan</text>
  </g>

  <path d="M343 273C407 273 407 254 471 254" fill="none" stroke="#55c6a9" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M343 383C407 383 407 424 471 424" fill="none" stroke="#e2b65f" stroke-width="4" marker-end="url(#arrowAmber)"/>

  <g filter="url(#shadow)">
    <rect x="488" y="205" width="643" height="135" rx="20" fill="#183b45" stroke="#55c6a9" stroke-width="2"/>
    <circle cx="531" cy="253" r="16" fill="#35b89e"/><path d="m524 253 5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="564" y="250" fill="#effaf6" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Di luar pengelolaan ekspor model</text>
    <text x="526" y="291" fill="#c7ded8" font-family="Inter, Arial, sans-serif" font-size="15">API · aplikasi / web · SaaS · deployment ringan di perangkat</text>
    <text x="526" y="317" fill="#91b9af" font-family="Inter, Arial, sans-serif" font-size="13">Teknologi yang sudah masuk domain publik juga dikecualikan menurut draft.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="488" y="365" width="643" height="139" rx="20" fill="#3a3340" stroke="#e2b65f" stroke-width="2"/>
    <circle cx="531" cy="413" r="16" fill="#d89c39"/><path d="M531 404v12M531 422v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="564" y="410" fill="#fff8e9" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Perlu cek cakupan dan pendaftaran</text>
    <text x="526" y="451" fill="#e8dcc4" font-family="Inter, Arial, sans-serif" font-size="15">Transfer kepemilikan · lisensi ke luar negeri · ubah kendali</text>
    <text x="526" y="479" fill="#cdbd9a" font-family="Inter, Arial, sans-serif" font-size="13">Ekspor teknologi yang tercantum masuk pendaftaran sementara.</text>
  </g>

  <text x="64" y="558" fill="#8da7b8" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".4">Ringkasan konseptual dari MOFCOM. Rancangan terbuka untuk masukan hingga 15 November 2026.</text>
</svg>
