  <circle cx="897" cy="305" r="5" fill="#72DFC1"/>
  <circle cx="914" cy="305" r="5" fill="#72DFC1" fill-opacity=".65"/>
  <circle cx="931" cy="305" r="5" fill="#72DFC1" fill-opacity=".35"/>

  <rect x="55" y="376" width="990" height="48" rx="12" fill="#19283C"/>
  <text x="77" y="406" fill="#BDD0E5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Tarif: US$0,75 per 1.000 Search sukses dan US$0,75 per 1.000 Fetch sukses.</text>
  <text x="56" y="451" fill="#8498B2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Sesuai panduan DeepSeek; kegagalan, timeout, dan hasil kosong tidak ditagih.</text>
