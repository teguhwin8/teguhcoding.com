  <text x="77" y="226" fill="#F0F5FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">Cari dokumentasi</text>
  <text x="77" y="252" fill="#F0F5FC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="600">rilis baru</text>
