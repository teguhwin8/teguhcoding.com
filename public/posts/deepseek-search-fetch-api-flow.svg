  </defs>
  <rect width="1100" height="470" rx="26" fill="url(#bg)"/>
  <text x="54" y="60" fill="#EDF3FB" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="700">Dari pertanyaan ke konteks web</text>
  <text x="56" y="91" fill="#A8B8CC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Keduanya memakai API key DeepSeek; hasil Fetch bergantung pada akses situs tujuan.</text>

  <rect x="55" y="148" width="205" height="190" rx="18" fill="#19263A" stroke="#4A617E" stroke-width="2"/>
