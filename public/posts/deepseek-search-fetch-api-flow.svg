<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A2D"/>
      <stop offset="1" stop-color="#1A2B41"/>
