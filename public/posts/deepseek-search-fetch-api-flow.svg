  <path d="M574 232L586 242L574 252" stroke="#76DCC5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="595" y="148" width="211" height="190" rx="18" fill="#18243A" stroke="#688FDC" stroke-width="2"/>
