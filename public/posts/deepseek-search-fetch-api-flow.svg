  <text x="617" y="291" fill="#CFD9E7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">→ teks Markdown</text>
  <text x="617" y="319" fill="#90A6C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">jika situs mengizinkan akses</text>

  <path d="M818 242H855" stroke="#76DCC5" stroke-width="4" stroke-linecap="round"/>
  <path d="M847 232L859 242L847 252" stroke="#76DCC5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="868" y="148" width="177" height="190" rx="18" fill="#19263A" stroke="#4A617E" stroke-width="2"/>
  <text x="890" y="183" fill="#90A6C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700" letter-spacing="1">4 · AGENT</text>
  <path d="M890 205H1023" stroke="#354B65" stroke-width="2"/>
