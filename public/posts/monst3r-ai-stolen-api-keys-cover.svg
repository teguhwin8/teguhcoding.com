    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffbd68"/><stop offset="1" stop-color="#ff795f"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51d9e8"/><stop offset="1" stop-color="#84a6ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="912" cy="318" r="220" fill="#ff8858" opacity=".11" filter="url(#glow)"/>
