<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">API key curian dipakai untuk membiayai pemindaian otomatis</title>
  <desc id="desc">Ilustrasi konseptual tentang API key AI curian yang dipakai alat pemindaian otomatis dan tagihannya masuk ke pemilik key.</desc>
  <defs>
